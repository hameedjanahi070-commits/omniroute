<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steam Logo Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1b2838;
    }

    .logo-container {
      text-align: center;
    }

    .logo-container img {
      width: 300px;
      filter: drop-shadow(0 0 30px rgba(102, 192, 244, 0.5));
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .logo-container img:hover {
      transform: scale(1.1);
      filter: drop-shadow(0 0 50px rgba(102, 192, 244, 0.8));
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg" alt="Steam Logo">
  </div>
</body>
</html>
